<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chatbot</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;display:flex;justify-content:center;padding:24px}
  .app{width:100%;max-width:640px;background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;height:calc(100vh - 48px);overflow:hidden}
  header{padding:16px 20px;background:#2563eb;color:#fff;font-weight:600}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#f9fafb}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.45}
  .bot{background:#fff;border:1px solid #e5e7eb;align-self:flex-start}
  .user{background:#2563eb;color:#fff;align-self:flex-end}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb}
  input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
  button{padding:0 20px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<div class="app">
  <header>AI Chatbot</header>
  <div id="chat"></div>
  <form id="form">
    <input id="msg" placeholder="Ask something..." autocomplete="off" maxlength="1000" autofocus>
    <button id="send">Send</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const history = [];

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text; // textContent keeps user text safe from HTML injection
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

add("bot", "Hi! How can I help you today?");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add("user", message);
  const typing = add("bot", "...");
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history })
    });
    const data = await res.json();
    typing.textContent = data.reply;
    history.push({ role: "user", content: message }, { role: "assistant", content: data.reply });
  } catch {
    typing.textContent = "Connection problem. Please try again.";
  }
  sendBtn.disabled = false;
  input.focus();
});
</script>
</body>
</html>
